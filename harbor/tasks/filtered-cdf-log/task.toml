schema_version = "1.4"

# Files pulled OUT of the container, so you can look at what the agent produced
# next to the verifier's verdict.  Paths are container paths.
# Collected at the END OF THE AGENT PHASE, before the verifier runs.
artifacts = [
  "/app/figure.png",
  "/app/plot.py",
  "/app/plotted_values.json",
]

[task]
name = "cmu-11768/filtered-cdf-log"
version = "1.0.0"
description = "Filter 500 request latencies to those above 50 ms, plot the empirical CDF on a log x axis with exact limits, a 0.5 reference line, and a median annotation."
keywords = ["visualization", "matplotlib", "cdf", "log-scale"]

[[task.authors]]
name = "Olivia Brown"

[metadata]
task_class = "data_transforms"
chart_family = "line-cdf"
source = "tasks/filtered-cdf-log/task.json"

[verifier]
# The verifier re-executes plot.py once (REEXEC_TIMEOUT=120s inside test_state.py).
timeout_sec = 600.0

[verifier.env]

[agent]
timeout_sec = 900.0

[environment]
# Grading must not need the network: everything is baked into the image.
network_mode = "no-network"
build_timeout_sec = 900.0
os = "linux"
cpus = 1
memory_mb = 2048
mcp_servers = []

[environment.env]
MPLBACKEND = "Agg"

[solution.env]